<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Devasya Organics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-bar">Free shipping on all orders over $50 | 100% Organic & Cruelty-Free</div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Devasya.</a>
      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="products.html" class="nav-link">Shop</a>
      </nav>
      <div class="header-actions">
        <a href="cart.html" class="nav-link">Cart (0)</a>
      </div>
    </div>
  </header>

  <main>
    <div class="auth-container reveal">
      <h1>Welcome Back</h1>
      <p>Sign in to access your account, track orders, and manage your skincare routine.</p>
      
      <form style="text-align: left;">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" class="form-control" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" class="form-control" required>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
          <label class="checkbox-group">
            <input type="checkbox"> Remember me
          </label>
          <a href="#" style="font-size: 0.9rem; text-decoration: underline;">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="account.html">Create one here</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><div class="footer-bottom">© 2024 Devasya Organics. All rights reserved.</div></div>
  </footer>
</body>
</html>
