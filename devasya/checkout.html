<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Devasya Organics</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-bar">Free shipping on all orders over $50 | 100% Organic & Cruelty-Free</div>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Devasya.</a>
      <div class="header-actions">
        <span style="font-size: 0.9rem; color: var(--gray);">Secure Checkout</span>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="checkout-layout">
        <form>
          <div class="checkout-section">
            <h3>Contact Information</h3>
            <div class="form-group">
              <label>Email Address</label>
              <input type="email" class="form-control" placeholder="you@example.com" required>
            </div>
          </div>

          <div class="checkout-section">
            <h3>Shipping Address</h3>
            <div class="form-row">
              <div class="form-group">
                <label>First Name</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="form-group">
                <label>Last Name</label>
                <input type="text" class="form-control" required>
              </div>
            </div>
            <div class="form-group">
              <label>Address</label>
              <input type="text" class="form-control" placeholder="Street address" required>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>City</label>
                <input type="text" class="form-control" required>
              </div>
              <div class="form-group">
                <label>Postal Code</label>
                <input type="text" class="form-control" required>
              </div>
            </div>
          </div>

          <div class="checkout-section">
            <h3>Payment Method</h3>
            <div class="payment-methods">
              <label class="payment-option active">
                <input type="radio" name="payment" checked style="accent-color: var(--black);">
                <span>Credit / Debit Card</span>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment" style="accent-color: var(--black);">
                <span>PayPal</span>
              </label>
            </div>
            <div style="margin-top: 24px;">
              <div class="form-group">
                <label>Card Number</label>
                <input type="text" class="form-control" placeholder="0000 0000 0000 0000">
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Expiry Date</label>
                  <input type="text" class="form-control" placeholder="MM/YY">
                </div>
                <div class="form-group">
                  <label>CVC</label>
                  <input type="text" class="form-control" placeholder="123">
                </div>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;">Complete Order</button>
        </form>

        <div class="cart-summary">
          <h3>Your Order</h3>
          <div style="display: flex; gap: 16px; margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--light-gray);">
            <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?auto=format&fit=crop&w=100&q=80" style="width: 60px; height: 70px; object-fit: cover; filter: grayscale(100%);">
            <div>
              <h4 style="font-size: 0.95rem;">Midnight Recovery Serum</h4>
              <p style="font-size: 0.85rem; color: var(--gray);">Qty: 1</p>
            </div>
            <span style="margin-left: auto; font-weight: 500;">$85.00</span>
          </div>
          <div class="summary-row">
            <span>Subtotal</span>
            <span>$85.00</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>Free</span>
          </div>
          <div class="summary-row total">
            <span>Total</span>
            <span>$85.00</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container"><div class="footer-bottom">© 2024 Devasya Organics. All rights reserved.</div></div>
  </footer>
</body>
</html>
